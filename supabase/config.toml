# Local development only. Hosted Auth settings must be configured separately.
project_id = "pacu-baseball-performance-local"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = false

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback", "http://localhost:3000/auth/confirm", "http://localhost:3000/reset-password", "http://127.0.0.1:3000/auth/callback", "http://127.0.0.1:3000/auth/confirm", "http://127.0.0.1:3000/reset-password"]
enable_signup = false
enable_anonymous_sign_ins = false
minimum_password_length = 12

[auth.email]
enable_signup = false
enable_confirmations = true
double_confirm_changes = true

[auth.email.template.recovery]
subject = "Reset your PACU Baseball Performance password"
content_path = "./supabase/templates/recovery.html"
